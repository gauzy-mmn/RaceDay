name: Validate Repository Structure

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Part 1 files exist in /docs
        run: |
          required_files=(
            "docs/ERD.png"
            "docs/APIEndpointPlan.pptx"
            "docs/RaceDay.sql"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then 
              echo "::error::Missing required file: $f"
              missing=1
            else
              echo "Found: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then 
            exit 1
          fi
